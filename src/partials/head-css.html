<!-- Google Font Link (https://fonts.google.com/) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Stylesheet.
     This MUST stay a real <link> in the <head>. It used to be pulled in by
     `import "../css/style.css"` inside app.js, which meant the browser painted
     the raw HTML first and only got the styles once the JS module had run —
     every navigation flashed an unstyled page. A render-blocking <link> makes
     the first paint a styled one. Vite still processes/bundles it. -->
<link rel="stylesheet" href="assets/css/style.css">

<script type="module" src="assets/js/app.js"></script>
