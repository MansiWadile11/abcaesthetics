<!-- Google Analytics 4.

     The tag ID is NOT written into this file. It is injected at build time by
     the handlebars context in vite.config.js, which defaults to the tag the
     old WordPress site used (GT-5TCZ3J3C) so the practice keeps one unbroken
     history across the rebuild.

     One switch covers the whole site:

       - VITE_GA_ID unset          ->  the old site's tag, so the new site
                                       reports into the same property.
       - VITE_GA_ID set to a value ->  that tag instead.
       - VITE_GA_ID set to EMPTY   ->  nothing below is emitted at all. No
                                       script tag, no request to Google, no
                                       cookie. Use this for the Preview
                                       environment in Vercel so review traffic
                                       never reaches the real reporting. -->
{{#if gaId}}
<script async src="https://www.googletagmanager.com/gtag/js?id={{gaId}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  /* The two "false" settings below are deliberate and matter for a medical
     practice. Both are ON by default in GA4.

     allow_google_signals
         Joins this site's traffic to the signed-in Google profile of the
         visitor and makes them available for cross-device remarketing
         audiences. On a site whose page names are conditions and treatments,
         that turns a page view into an advertising signal about someone's
         health. Off.

     allow_ad_personalization_signals
         Lets the collected data feed ad personalisation. Same reasoning. Off.

     Turning these on later is a one-line change, but it is a decision for
     the practice to make knowingly rather than inherit from a default.

     GA4 anonymises IP addresses for every event automatically - there is no
     longer an anonymize_ip flag to set. */
  gtag('config', '{{gaId}}', {
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>
{{/if}}
